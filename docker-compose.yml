version: "3.9"

services:
  backend:
    build: ./Back-end
    ports:
      - "5001:5001"
    env_file:
      - ./Back-end/.env

  frontend:
    build: ./Srisuwan
    ports:
      - "5173:5173"
    env_file:
      - ./Srisuwan/.env
    depends_on:
      - backend


